name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Bundle, lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      APP_ENV: development
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Proves the JS bundles for native (Metro resolution, Babel, Uniwind CSS).
      # Note: Expo Router's strict typed-route declarations (.expo/types) are only generated by
      # `expo start`, so CI type-checks hrefs loosely; local development checks them strictly.
      - name: Bundle (Android JS)
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/dist"

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test --ci --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
